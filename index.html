<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Order Sheet</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0f0f13;--surface:#1a1a22;--surface2:#22222e;--border:#2e2e3e;
    --accent:#00e5a0;--accent2:#f0c040;--danger:#ff5f6d;
    --text:#e8e8f0;--muted:#6b6b80;--radius:12px;--tap:52px;
    --freezer:#4a9ebb;--walkin:#4ebb7a;--office:#d4845a;
    --attic:#9b6bbf;--cooler:#d4a24a;--baking:#e07070;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh;padding-bottom:120px;}

  /* HEADER */
  header{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 16px 10px;}
  .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  h1{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;letter-spacing:-0.5px;color:var(--accent);}
  .date-badge{font-size:10px;color:var(--muted);background:var(--surface);padding:4px 10px;border-radius:20px;border:1px solid var(--border);}
  .sync-badge{font-size:10px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);transition:all .3s;}
  .sync-badge.loading{color:#aaa;border-color:var(--border);background:var(--surface);}
  .sync-badge.ok{color:var(--accent);border-color:var(--accent);background:rgba(0,229,160,.08);}
  .sync-badge.err{color:var(--danger);border-color:var(--danger);background:rgba(255,95,109,.08);}
  .search-wrap{position:relative;}
  .search-wrap input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'DM Mono',monospace;font-size:13px;padding:10px 14px 10px 36px;outline:none;transition:border-color .2s;}
  .search-wrap input:focus{border-color:var(--accent);}
  .search-wrap input::placeholder{color:var(--muted);}
  .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none;}

  /* TABS */
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 0;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;transition:all .15s;white-space:nowrap;}
  .tab.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:500;}

  /* MAIN */
  main{padding:12px 16px 0;}
  .legend{margin:0 0 12px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-size:10px;color:var(--muted);line-height:1.9;}
  .legend span{color:var(--accent2);}

  /* LOADING STATE */
  .loading-state{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;}
  .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* SECTION */
  .section{margin-bottom:8px;}
  .section-header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--radius) var(--radius) 0 0;cursor:pointer;user-select:none;position:relative;overflow:hidden;}
  .section-header::before{content:'';position:absolute;inset:0;opacity:.12;background:currentColor;}
  .section-dot{width:10px;height:10px;border-radius:50%;background:currentColor;flex-shrink:0;}
  .section-label{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;flex:1;}
  .section-count{font-size:11px;opacity:.7;background:rgba(0,0,0,.25);padding:2px 8px;border-radius:10px;}
  .section-chevron{font-size:12px;transition:transform .2s;}
  .section.collapsed .section-chevron{transform:rotate(-90deg);}
  .section-body{background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius) var(--radius);overflow:hidden;}
  .section.collapsed .section-body{display:none;}

  /* COL HEADER */
  .col-header{display:grid;grid-template-columns:52px 1fr 90px 72px 36px;background:var(--surface2);border-bottom:1px solid var(--border);padding:5px 0;}
  .col-header span{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:center;}
  .col-header span:nth-child(2){text-align:left;padding-left:2px;}

  /* ITEM */
  .item{display:grid;grid-template-columns:52px 1fr 90px 72px 36px;align-items:center;min-height:var(--tap);border-bottom:1px solid var(--border);transition:background .1s;}
  .item:last-child{border-bottom:none;}
  .item.checked{background:rgba(0,229,160,.04);}
  .item.hidden{display:none;}
  .item-check{display:flex;align-items:center;justify-content:center;height:100%;cursor:pointer;}
  .check-box{width:26px;height:26px;border-radius:8px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:14px;color:transparent;}
  .item.checked .check-box{background:var(--accent);border-color:var(--accent);color:#000;}
  .item-name{font-size:13px;padding:10px 6px 10px 2px;line-height:1.3;cursor:pointer;}
  .item.checked .item-name{color:var(--accent);}

  /* QTY */
  .qty-wrap{display:flex;align-items:center;justify-content:center;}
  .qty-inner{display:flex;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .qty-required .qty-inner{border-color:var(--accent2);}
  .qty-btn{width:26px;height:32px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--accent);font-size:16px;cursor:pointer;font-family:'DM Mono',monospace;transition:background .1s;-webkit-user-select:none;user-select:none;}
  .qty-btn:active{background:rgba(0,229,160,.15);}
  .qty-val{min-width:22px;text-align:center;font-size:12px;font-weight:500;color:var(--accent2);}

  /* PAR */
  .par-wrap{display:flex;align-items:center;justify-content:center;padding:0 4px;}
  .par-input{width:48px;height:32px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-family:'DM Mono',monospace;font-size:12px;text-align:center;outline:none;transition:border-color .15s,color .15s;}
  .par-input:focus{border-color:var(--accent2);color:var(--accent2);}
  .par-input.dirty{border-color:var(--accent2);color:var(--accent2);}
  .par-input::placeholder{color:var(--border);}

  /* NOTE */
  .note-cell{display:flex;align-items:center;justify-content:center;}
  .note-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:var(--surface2);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;transition:border-color .15s;}
  .note-btn.has-note{border-color:var(--accent2);}
  .note-row{display:none;grid-column:1 / -1;padding:0 12px 10px 54px;}
  .note-row.open{display:block;}
  .note-row input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Mono',monospace;font-size:12px;padding:8px 12px;outline:none;}
  .note-row input:focus{border-color:var(--accent2);}
  .note-row input::placeholder{color:var(--muted);}

  /* BOTTOM BAR */
  .bottom-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:10px;z-index:100;}
  .btn{flex:1;height:48px;border-radius:var(--radius);border:none;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;letter-spacing:.5px;cursor:pointer;transition:opacity .15s,transform .1s;}
  .btn:active{opacity:.8;transform:scale(.98);}
  .btn-primary{background:var(--accent);color:#000;}
  .btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);flex:0 0 auto;width:48px;}
  .checked-count{font-size:11px;font-family:'DM Mono',monospace;font-weight:400;}

  /* MODAL */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;padding:16px;overflow-y:auto;}
  .modal-overlay.open{display:flex;align-items:flex-start;justify-content:center;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:480px;margin:auto;overflow:hidden;}
  .modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);background:var(--surface2);}
  .modal-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:var(--accent);}
  .modal-close{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;padding:0 4px;}
  .modal-body{padding:16px 20px;}
  .modal-date{font-size:11px;color:var(--muted);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);}
  .summary-section{margin-bottom:16px;}
  .summary-section-title{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--border);}
  .summary-item-wrap{border-bottom:1px solid var(--border);padding:6px 0;}
  .summary-item-wrap:last-child{border-bottom:none;}
  .summary-item{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;gap:12px;}
  .summary-item-name{flex:1;}
  .summary-item-qty{color:var(--accent2);font-size:12px;white-space:nowrap;}
  .summary-item-note{font-size:11px;color:var(--muted);font-style:italic;padding-left:12px;margin-top:2px;}
  .modal-actions{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--border);flex-wrap:wrap;}
  .copy-btn{flex:1;min-width:120px;height:44px;border-radius:var(--radius);background:var(--accent);color:#000;border:none;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;cursor:pointer;}
  .submit-btn{flex:1;min-width:120px;height:44px;border-radius:var(--radius);background:var(--surface2);color:var(--accent);border:1px solid var(--accent);font-family:'Syne',sans-serif;font-size:12px;font-weight:700;cursor:pointer;}
  .reset-btn{height:44px;padding:0 16px;border-radius:var(--radius);background:var(--surface2);color:var(--danger);border:1px solid var(--danger);font-family:'Syne',sans-serif;font-size:12px;font-weight:700;cursor:pointer;}
  .action-feedback{text-align:center;font-size:11px;height:18px;margin-top:4px;padding-bottom:8px;}
  .action-feedback.ok{color:var(--accent);}
  .action-feedback.err{color:var(--danger);}
  .section.all-hidden{display:none;}

  /* PAR SAVE TOAST */
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--accent);color:var(--accent);font-size:11px;padding:8px 18px;border-radius:20px;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>🍽 ORDER SHEET</h1>
    <div style="display:flex;gap:8px;align-items:center;">
      <div class="sync-badge loading" id="syncBadge">⟳ Loading...</div>
      <div class="date-badge" id="dateBadge"></div>
    </div>
  </div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="searchInput" placeholder="Search items..." autocomplete="off" autocorrect="off" spellcheck="false">
  </div>
</header>

<div class="tabs" id="tabBar"></div>
<main id="mainContent">
  <div class="legend">
    <span>☑</span> Check item to flag — QTY auto-sets to 1 &nbsp;|&nbsp;
    <span>QTY</span> Adjust cases with +/− &nbsp;|&nbsp;
    <span>PAR</span> Tap to edit, saves to sheet &nbsp;|&nbsp;
    <span>★</span> Yellow = always enter quantity
  </div>
  <div class="loading-state" id="loadingState">
    <div class="spinner"></div>
    Loading items from Google Sheets...
  </div>
</main>

<div class="bottom-bar">
  <button class="btn btn-secondary" id="clearBtn" title="Clear all">↺</button>
  <button class="btn btn-primary" id="summaryBtn">VIEW ORDER <span class="checked-count" id="checkedCount"></span></button>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">📋 ORDER SUMMARY</span>
      <button class="modal-close" id="modalClose">×</button>
    </div>
    <div class="modal-body">
      <div class="modal-date" id="modalDate"></div>
      <div id="summaryContent"></div>
    </div>
    <div class="modal-actions">
      <button class="copy-btn" id="copyBtn">📋 COPY LIST</button>
      <button class="submit-btn" id="submitBtn">☁️ SAVE TO SHEET</button>
      <button class="reset-btn" id="resetBtn">CLEAR</button>
    </div>
    <div class="action-feedback" id="actionFeedback"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxk5kpgXi5HEEApA50s2JTgySfgfuYaTesVYG2_YtbtT_5mFvaGOfs_Y7wWRbD8tvA41g/exec";

const SECTION_COLORS = {
  "FREEZER":"var(--freezer)","WALK-IN":"var(--walkin)",
  "OFFICE / SHELF":"var(--office)","ATTIC":"var(--attic)",
  "KITCHEN COOLER":"var(--cooler)","BAKING":"var(--baking)"
};

// State
let sections = [];
const orderState = {};
const parState  = {};

function getKey(sId,iIdx){return `${sId}:${iIdx}`;}
function getOrder(sId,iIdx){return orderState[getKey(sId,iIdx)]||{checked:false,qty:0,note:""};}
function setOrder(sId,iIdx,patch){orderState[getKey(sId,iIdx)]={...getOrder(sId,iIdx),...patch};}

function fmtDate(){
  return new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"});
}
document.getElementById("dateBadge").textContent = fmtDate();

// ── LOAD FROM SHEET ──
async function loadItems(){
  const badge = document.getElementById("syncBadge");
  badge.className = "sync-badge loading";
  badge.textContent = "⟳ Loading...";
  try {
    const res = await fetch(`${SCRIPT_URL}?action=getItems`);
    const data = await res.json();
    if(data.status !== "ok") throw new Error("Bad response");

    // Group items into sections preserving sheet order
    const secMap = {};
    const secOrder = [];
    data.items.forEach(item => {
      const sid = item.section.toLowerCase().replace(/[^a-z]/g,"");
      if(!secMap[sid]){
        secMap[sid] = { id: sid, label: item.section, color: SECTION_COLORS[item.section]||"var(--muted)", items:[] };
        secOrder.push(sid);
      }
      secMap[sid].items.push({ name: item.name, qty: item.alwaysQty, par: item.par });
    });
    sections = secOrder.map(id => secMap[id]);

    // Seed PAR state from sheet
    sections.forEach(sec => {
      sec.items.forEach((item,idx) => {
        if(item.par !== "") parState[getKey(sec.id,idx)] = item.par;
      });
    });

    document.getElementById("loadingState").remove();
    buildUI();
    badge.className = "sync-badge ok";
    badge.textContent = "✓ Synced";
  } catch(err){
    badge.className = "sync-badge err";
    badge.textContent = "✕ Offline";
    document.getElementById("loadingState").innerHTML =
      `<p style="color:var(--danger);font-size:13px;">Could not load items from Google Sheets.<br><br>Check your connection and refresh.</p>`;
  }
}

// ── BUILD UI ──
function buildUI(){
  const tabBar = document.getElementById("tabBar");
  const main   = document.getElementById("mainContent");

  const allTab = document.createElement("button");
  allTab.className = "tab active";
  allTab.textContent = "ALL";
  allTab.dataset.section = "all";
  tabBar.appendChild(allTab);

  sections.forEach(sec => {
    // Tab
    const tab = document.createElement("button");
    tab.className = "tab";
    tab.textContent = sec.label;
    tab.dataset.section = sec.id;
    tabBar.appendChild(tab);

    // Section
    const secEl = document.createElement("div");
    secEl.className = "section";
    secEl.id = `sec-${sec.id}`;

    const hdr = document.createElement("div");
    hdr.className = "section-header";
    hdr.style.color = sec.color;
    hdr.innerHTML = `
      <div class="section-dot"></div>
      <div class="section-label">${sec.label}</div>
      <div class="section-count" id="count-${sec.id}">0 / ${sec.items.length}</div>
      <div class="section-chevron">▾</div>`;
    hdr.addEventListener("click", ()=> secEl.classList.toggle("collapsed"));
    secEl.appendChild(hdr);

    const body = document.createElement("div");
    body.className = "section-body";

    const colHdr = document.createElement("div");
    colHdr.className = "col-header";
    colHdr.innerHTML = `<span></span><span>ITEM</span><span>QTY</span><span>PAR</span><span></span>`;
    body.appendChild(colHdr);

    sec.items.forEach((item,idx) => {
      const parVal = parState[getKey(sec.id,idx)] || "";
      const itemEl = document.createElement("div");
      itemEl.className = "item" + (item.qty ? " qty-required" : "");
      itemEl.id = `item-${sec.id}-${idx}`;
      itemEl.dataset.name = item.name.toLowerCase();
      itemEl.innerHTML = `
        <div class="item-check"><div class="check-box" id="chk-${sec.id}-${idx}">✓</div></div>
        <div class="item-name" id="name-${sec.id}-${idx}">${item.name}</div>
        <div class="qty-wrap">
          <div class="qty-inner">
            <button class="qty-btn" data-action="dec" data-sec="${sec.id}" data-idx="${idx}">−</button>
            <div class="qty-val" id="qty-${sec.id}-${idx}">0</div>
            <button class="qty-btn" data-action="inc" data-sec="${sec.id}" data-idx="${idx}">+</button>
          </div>
        </div>
        <div class="par-wrap">
          <input class="par-input${parVal ? " dirty" : ""}" type="number" min="0" placeholder="—"
            id="par-${sec.id}-${idx}" data-sec="${sec.id}" data-idx="${idx}" value="${parVal}">
        </div>
        <div class="note-cell">
          <button class="note-btn" id="notebtn-${sec.id}-${idx}" data-sec="${sec.id}" data-idx="${idx}">✎</button>
        </div>
        <div class="note-row" id="noterow-${sec.id}-${idx}">
          <input type="text" placeholder="Add note..." id="noteinput-${sec.id}-${idx}" data-sec="${sec.id}" data-idx="${idx}">
        </div>`;
      body.appendChild(itemEl);
    });

    secEl.appendChild(body);
    main.appendChild(secEl);
  });

  attachEvents();
  updateCounts();
}

// ── EVENTS ──
function attachEvents(){
  const main = document.getElementById("mainContent");

  // Checkbox / name
  main.addEventListener("click", e => {
    const chk = e.target.closest(".item-check, .item-name");
    if(!chk) return;
    const item = chk.closest(".item");
    if(!item) return;
    const [,sId,idx] = item.id.split("-");
    const iIdx = parseInt(idx);
    const cur = getOrder(sId,iIdx);
    const nowChecked = !cur.checked;
    setOrder(sId,iIdx,{checked:nowChecked, qty: nowChecked && cur.qty===0 ? 1 : cur.qty});
    renderItem(sId,iIdx);
    updateCounts();
  });

  // QTY buttons
  main.addEventListener("click", e => {
    const btn = e.target.closest(".qty-btn");
    if(!btn) return;
    const {action,sec,idx} = btn.dataset;
    const iIdx = parseInt(idx);
    const cur = getOrder(sec,iIdx);
    let newQty = cur.qty + (action==="inc" ? 1 : -1);
    if(newQty < 0) newQty = 0;
    setOrder(sec,iIdx,{qty:newQty, checked: newQty>0 ? true : cur.checked});
    renderItem(sec,iIdx);
    updateCounts();
  });

  // PAR — save to sheet on blur
  main.addEventListener("change", e => {
    const inp = e.target.closest(".par-input");
    if(!inp) return;
    const {sec,idx} = inp.dataset;
    inp.classList.add("dirty");
    parState[getKey(sec,parseInt(idx))] = inp.value;
    savePar(sec, parseInt(idx), inp.value, inp);
  });

  // Note toggle
  main.addEventListener("click", e => {
    const btn = e.target.closest(".note-btn");
    if(!btn) return;
    const {sec,idx} = btn.dataset;
    const nr = document.getElementById(`noterow-${sec}-${idx}`);
    nr.classList.toggle("open");
    if(nr.classList.contains("open")) document.getElementById(`noteinput-${sec}-${idx}`).focus();
  });

  // Note input
  main.addEventListener("input", e => {
    const inp = e.target.closest(".note-row input");
    if(!inp) return;
    const {sec,idx} = inp.dataset;
    setOrder(sec,parseInt(idx),{note:inp.value});
    document.getElementById(`notebtn-${sec}-${idx}`).classList.toggle("has-note",inp.value.length>0);
  });

  // Tabs
  document.getElementById("tabBar").addEventListener("click", e => {
    const tab = e.target.closest(".tab");
    if(!tab) return;
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    const target = tab.dataset.section;
    document.querySelectorAll(".section").forEach(s=>{
      s.style.display = (target==="all"||s.id===`sec-${target}`) ? "" : "none";
    });
    if(target!=="all") document.getElementById(`sec-${target}`)?.scrollIntoView({behavior:"smooth",block:"start"});
  });

  // Search
  document.getElementById("searchInput").addEventListener("input", e => {
    const q = e.target.value.toLowerCase().trim();
    sections.forEach(sec => {
      let any = false;
      sec.items.forEach((item,idx) => {
        const el = document.getElementById(`item-${sec.id}-${idx}`);
        const match = !q || item.name.toLowerCase().includes(q);
        el.classList.toggle("hidden",!match);
        if(match) any = true;
      });
      document.getElementById(`sec-${sec.id}`).classList.toggle("all-hidden",!any);
      if(q && any) document.getElementById(`sec-${sec.id}`).classList.remove("collapsed");
    });
  });

  // Clear
  document.getElementById("clearBtn").addEventListener("click", ()=>{
    if(!confirm("Clear all checked items?")) return;
    clearAll();
  });

  // Summary
  document.getElementById("summaryBtn").addEventListener("click", openSummary);
  document.getElementById("modalClose").addEventListener("click", ()=>document.getElementById("modalOverlay").classList.remove("open"));
  document.getElementById("modalOverlay").addEventListener("click", e=>{
    if(e.target===document.getElementById("modalOverlay")) document.getElementById("modalOverlay").classList.remove("open");
  });

  // Copy
  document.getElementById("copyBtn").addEventListener("click", copyOrder);

  // Submit to sheet
  document.getElementById("submitBtn").addEventListener("click", submitOrder);

  // Reset from modal
  document.getElementById("resetBtn").addEventListener("click", ()=>{
    if(!confirm("Clear entire order?")) return;
    clearAll();
    document.getElementById("modalOverlay").classList.remove("open");
  });
}

// ── SAVE PAR TO SHEET ──
async function savePar(secId, iIdx, value, inputEl){
  const sec = sections.find(s=>s.id===secId);
  if(!sec) return;
  const itemName = sec.items[iIdx]?.name;
  showToast("Saving PAR...");
  try {
    const url = `${SCRIPT_URL}?action=savePar&section=${encodeURIComponent(sec.label)}&item=${encodeURIComponent(itemName)}&par=${encodeURIComponent(value)}`;
    const res = await fetch(url);
    const data = await res.json();
    if(data.status === "ok") showToast("✓ PAR saved to sheet");
    else showToast("✕ PAR save failed");
  } catch {
    showToast("✕ Could not reach sheet");
  }
}

// ── SUBMIT ORDER TO SHEET ──
async function submitOrder(){
  const btn = document.getElementById("submitBtn");
  const fb  = document.getElementById("actionFeedback");
  const items = [];

  sections.forEach(sec => {
    sec.items.forEach((item,idx) => {
      const s = getOrder(sec.id,idx);
      if(!s.checked) return;
      items.push({
        section: sec.label,
        name: item.name,
        qty: s.qty,
        par: parState[getKey(sec.id,idx)] || "",
        note: s.note || ""
      });
    });
  });

  if(!items.length){
    fb.className = "action-feedback err";
    fb.textContent = "No items checked to submit.";
    setTimeout(()=>fb.textContent="",3000);
    return;
  }

  btn.textContent = "⟳ Saving...";
  btn.disabled = true;
  try {
    await fetch(SCRIPT_URL, {
      method:"POST",
      body: JSON.stringify({ items }),
      headers:{"Content-Type":"application/json"}
    });
    fb.className = "action-feedback ok";
    fb.textContent = `✓ ${items.length} item${items.length!==1?"s":""} saved to Google Sheets`;
    btn.textContent = "☁️ SAVE TO SHEET";
    btn.disabled = false;
    setTimeout(()=>fb.textContent="",4000);
  } catch {
    fb.className = "action-feedback err";
    fb.textContent = "✕ Could not reach sheet. Check connection.";
    btn.textContent = "☁️ SAVE TO SHEET";
    btn.disabled = false;
    setTimeout(()=>fb.textContent="",4000);
  }
}

// ── COPY ORDER ──
function copyOrder(){
  let text = `ORDER — ${fmtDate()}\n`;
  text += "─".repeat(36) + "\n";

  let lastSection = "";
  sections.forEach(sec => {
    const checkedItems = sec.items
      .map((item,idx)=>({item,idx,s:getOrder(sec.id,idx)}))
      .filter(x=>x.s.checked);
    if(!checkedItems.length) return;

    text += `\n[ ${sec.label} ]\n`;
    checkedItems.forEach(({item,s})=>{
      const note = s.note ? ` (${s.note})` : "";
      text += `  ${s.qty}x ${item.name}${note}\n`;
    });
  });

  navigator.clipboard.writeText(text).then(()=>{
    showFeedback("✓ Copied to clipboard","ok");
  }).catch(()=>{
    showFeedback("✕ Copy failed","err");
  });
}

function showFeedback(msg, type){
  const fb = document.getElementById("actionFeedback");
  fb.className = `action-feedback ${type}`;
  fb.textContent = msg;
  setTimeout(()=>fb.textContent="",3000);
}

// ── RENDER ──
function renderItem(sId,iIdx){
  const s = getOrder(sId,iIdx);
  document.getElementById(`item-${sId}-${iIdx}`).classList.toggle("checked",s.checked);
  document.getElementById(`qty-${sId}-${iIdx}`).textContent = s.qty;
}

function updateCounts(){
  let total = 0;
  sections.forEach(sec=>{
    let checked = 0;
    sec.items.forEach((_,idx)=>{ if(getOrder(sec.id,idx).checked) checked++; });
    total += checked;
    const el = document.getElementById(`count-${sec.id}`);
    if(el) el.textContent = `${checked} / ${sec.items.length}`;
  });
  document.getElementById("checkedCount").textContent = total>0 ? `(${total})` : "";
}

// ── OPEN SUMMARY ──
function openSummary(){
  document.getElementById("modalDate").textContent = `Order Date: ${fmtDate()}`;
  const container = document.getElementById("summaryContent");
  container.innerHTML = "";
  let anyChecked = false;

  sections.forEach(sec=>{
    const checkedItems = sec.items
      .map((item,idx)=>({item,idx,s:getOrder(sec.id,idx)}))
      .filter(x=>x.s.checked);
    if(!checkedItems.length) return;
    anyChecked = true;

    const secDiv = document.createElement("div");
    secDiv.className = "summary-section";
    const title = document.createElement("div");
    title.className = "summary-section-title";
    title.style.color = sec.color;
    title.textContent = sec.label;
    secDiv.appendChild(title);

    checkedItems.forEach(({item,idx,s})=>{
      const par = parState[getKey(sec.id,idx)];
      const wrap = document.createElement("div");
      wrap.className = "summary-item-wrap";
      const row = document.createElement("div");
      row.className = "summary-item";
      row.innerHTML = `
        <span class="summary-item-name">${s.qty}x ${item.name}</span>
        <span class="summary-item-qty">${par ? "PAR: "+par : ""}</span>`;
      wrap.appendChild(row);
      if(s.note){
        const note = document.createElement("div");
        note.className = "summary-item-note";
        note.textContent = `↳ ${s.note}`;
        wrap.appendChild(note);
      }
      secDiv.appendChild(wrap);
    });
    container.appendChild(secDiv);
  });

  if(!anyChecked) container.innerHTML = `<p style="color:var(--muted);font-size:13px;text-align:center;padding:20px 0;">No items checked yet.</p>`;
  document.getElementById("modalOverlay").classList.add("open");
}

// ── CLEAR ──
function clearAll(){
  Object.keys(orderState).forEach(k=>delete orderState[k]);
  sections.forEach(sec=>{
    sec.items.forEach((_,idx)=>{
      renderItem(sec.id,idx);
      const ni = document.getElementById(`noteinput-${sec.id}-${idx}`);
      if(ni) ni.value="";
      document.getElementById(`notebtn-${sec.id}-${idx}`)?.classList.remove("has-note");
      document.getElementById(`noterow-${sec.id}-${idx}`)?.classList.remove("open");
    });
  });
  updateCounts();
}

// ── TOAST ──
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2200);
}

// ── INIT ──
loadItems();
